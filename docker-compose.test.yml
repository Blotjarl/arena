services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena_test
    ports:
      - "55432:5432"
    volumes:
      - ./packages/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data # ephemeral -- no state persists between `docker compose up`s
